name: Build executable
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: microsoft/setup-msbuild@v2
      - name: Build Web Panel
        working-directory: web-panel
        run: |
          pnpm install
          pnpm run build
      - name: Build EXE
        run: |
          nuget restore Wand-Enhancer.sln
          msbuild Wand-Enhancer.sln /p:Configuration=Release /p:Platform="Any CPU"
      - uses: actions/upload-artifact@v4
        with:
          name: WandEnhancer
          path: WandEnhancer/bin/Release/
